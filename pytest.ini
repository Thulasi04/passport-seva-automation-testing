[pytest]
# Pytest configuration for Passport Seva UI Automation Suite

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers configuration
markers =
    home: Tests covering Passport Seva homepage layout, branding, and widgets
    navigation: Tests covering quick link and navbar navigation
    accessibility: Tests covering accessibility controls and font resizing
    login: Tests covering user login and authentication forms
    registration: Tests covering user registration forms and inputs
    appointment: Tests covering appointment availability checks and office dropdowns
    services: Tests covering passport service catalogs and statutory rules
    tracking: Tests covering application status tracking workflows
    smoke: Smoke test subset for quick validation
    regression: Full regression test suite

# CLI options
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
